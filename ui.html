<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Slot Master</title>

<style>
  :root{
    --bg:#f5f5f5;
    --surface:#ffffff;
    --surface-2:#fafafa;
    --line:#e5e5e5;
    --line-2:#efefef;
    --text:#111111;
    --muted:#6b7280;
    --blue:#111111;
    --blue-2:#111111;
    --blue-soft:#f3f4f6;
    --blue-soft-2:#f8f8f8;
    --success:#16a34a;
    --warning:#d97706;
    --danger:#dc2626;
    --shadow:none;
    --radius:16px;
    --radius-sm:12px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:12px;
    color:var(--text);
    background:var(--bg);
    padding:18px;
  }

  .app-shell{
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow: var(--shadow);
    overflow:hidden;
  }

  .hero{
    padding:16px 18px 12px;
    border-bottom:1px solid var(--line-2);
    background:#fff;
  }

  .hero-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:8px;
  }

  .hero-spacer{flex:1}

  .lang-switch{
    display:flex;
    align-items:center;
    gap:3px;
    padding:3px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#f7f7f7;
  }

  .lang-btn{
    height:30px;
    min-width:38px;
    padding:0 9px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    box-shadow:none;
    font-size:11px;
    font-weight:800;
  }

  .lang-btn:hover{
    transform:none;
    box-shadow:none;
    border-color:transparent;
  }

  .lang-btn.active{
    color:#fff;
    background:#111111;
    box-shadow:none;
  }

  .brand-icon{
    width:48px;height:48px;border-radius:15px;
    display:block;
    object-fit:cover;
    box-shadow:0 0 0 1px rgba(17,17,17,.06);
    flex:0 0 auto;
    background:#070b14;
  }

  .title-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    min-width:0;
  }
  .title-main{
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width:0;
  }
  .title-line{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
  }
  h1{
    margin:0;
    font-size:24px;
    line-height:1.1;
    letter-spacing:-.025em;
  }
  .author-line{
    font-size:11px;
    line-height:1.35;
    color:var(--muted);
    font-weight:650;
    letter-spacing:.005em;
  }
  .version-badge{
    display:inline-flex;align-items:center;
    padding:5px 10px;border-radius:999px;
    background:#f3f4f6;
    color:#111111;font-weight:700;font-size:12px;
  }

  .sub{
    margin:0;
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
    max-width:680px;
  }

  .content{padding:14px 16px 16px}

  .box, .normalize-box, .section, .stat{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:none;
  }

  .box, .normalize-box{padding:16px;margin-bottom:14px}
  .normalize-title,.label{
    display:flex;align-items:center;gap:10px;
    margin:0 0 8px;
    font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--text);
  }
  .label{font-size:17px}
  .normalize-title::before,.label::before{
    content:"";
    width:10px;height:10px;border-radius:999px;
    background:#111111;
    box-shadow:0 0 0 4px #f1f1f1;
    flex:0 0 auto;
  }

  textarea{
    width:100%;
    min-height:180px;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    background:var(--surface-2);
    color:var(--text);
    font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height:1.45;
    outline:none;
  }
  textarea:focus,
  .field input[type="number"]:focus,
  .field select:focus{
    border-color:#111111;
    box-shadow:0 0 0 3px rgba(17,17,17,.08);
  }

  .hint,#selection,#preview,.ref{
    color:var(--muted);
    line-height:1.5;
  }

  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

  button{
    height:40px;
    border-radius:14px;
    padding:0 14px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--text);
    cursor:pointer;
    font-weight:700;
    font-size:13px;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  button:hover{transform:none;box-shadow:none;border-color:#cfcfcf}
  button.primary{
    color:#fff;
    border-color:#111111;
    background:#111111;
    box-shadow:none;
  }
  button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}

  .checks{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px 18px;
    margin:12px 0;
    padding:14px;
    border:1px solid var(--line-2);
    border-radius:14px;
    background:#fbfbfb;
  }
  .checks label{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--text);
    font-weight:500;
  }
  input[type="checkbox"]{accent-color:#111111}
  input[type="range"]{accent-color:#111111}

  .autofit-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:10px;
    margin:12px 0;
  }
  .field label{
    display:block;
    font-size:11px;
    margin-bottom:5px;
    color:var(--muted);
    font-weight:600;
  }
  .inline-setting{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:44px;
    margin:10px 0;
    padding:8px 10px;
    border:1px solid var(--line-2);
    border-radius:12px;
    background:#fafafa;
  }
  .inline-setting label{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
    color:var(--text);
    font-weight:500;
  }
  .inline-setting .mini-number{
    width:76px;
    height:34px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:0 9px;
    background:#fff;
    color:var(--text);
    outline:none;
    text-align:right;
  }
  .inline-setting .suffix{
    color:var(--muted);
    font-size:11px;
    margin-left:-5px;
  }

  .field input[type="number"],
  .field select{
    width:100%;
    height:38px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:0 10px;
    background:#fff;
    color:var(--text);
    outline:none;
  }

  #status, #normalizeStatus, #autoFitStatus{margin-top:12px;line-height:1.5}

  .ok{color:var(--success)}
  .warn{color:var(--warning)}
  .err{color:var(--danger)}

  .summary{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
    margin-top:12px;
  }
  .stat{padding:14px 16px}
  .stat strong{
    display:block;
    font-size:26px;
    line-height:1;
    margin-bottom:4px;
    letter-spacing:-.03em;
  }

  .section{margin-top:14px;overflow:hidden}
  .section-head{
    padding:12px 14px;
    font-weight:800;
    font-size:14px;
    background:#fafafa;
    border-bottom:1px solid var(--line-2);
  }
  .list{max-height:220px;overflow:auto;padding:0 14px}
  .item{
    padding:10px 0;
    border-bottom:1px solid var(--line-2);
  }
  .item:last-child{border-bottom:0}

  code{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background:#f7f7f7;
    border:1px solid #dce9ff;
    color:#355587;
    padding:2px 6px;
    border-radius:8px;
  }

  details{
    margin-top:10px;
    border:1px solid var(--line-2);
    background:#fbfbfb;
    border-radius:14px;
    padding:8px 12px;
  }
  summary{
    cursor:pointer;
    font-weight:700;
    color:var(--text);
  }

  .note{
    margin-top:12px;
    padding:12px 14px;
    border-radius:14px;
    background:#fafafa;
    border:1px solid var(--line-2);
    color:var(--muted);
  }

  .pill-note{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
    padding:8px 12px;
    border-radius:999px;
    background:#f5f5f5;
    color:#444444;
    font-weight:600;
  }

  
  .toolbar-actions{
    display:flex;
    align-items:center;
    gap:8px;
    margin-right:8px;
  }
  .icon-btn{
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    border-radius:12px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    box-shadow:none;
  }
  .icon-btn:hover{transform:none;box-shadow:none;border-color:#d4d4d4}
  .tabs{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:0;
    margin-top:14px;
    border-top:1px solid var(--line-2);
    border-bottom:1px solid var(--line-2);
    padding-top:8px;
  }
  .tab-btn{
    white-space:nowrap;
    height:auto;
    min-height:48px;
    min-width:0;
    border:none;
    border-radius:0;
    background:transparent;
    box-shadow:none;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:0 6px;
    color:var(--muted);
    position:relative;
    font-size:10.5px;
    font-weight:650;
    overflow:hidden;
  }
  .tab-btn span:last-child{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tab-btn .tab-ico{
    flex:0 0 auto;
    font-size:14px;
    line-height:1;
  }
  .tab-btn:hover{transform:none;box-shadow:none;border-color:transparent}
  .tab-btn.active{
    color:#111111;
  }
  .tab-btn.active::after{
    content:"";
    position:absolute;
    left:12%;
    right:12%;
    bottom:-1px;
    height:2px;
    border-radius:999px;
    background:#111111;
  }
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  .top-inline-actions{
    display:flex;
    gap:10px;
    margin:0 0 14px;
  }
  .danger-btn{
    color:#b4232d;
    background:#fff5f5;
    border-color:#ffd4d8;
  }
  .danger-btn:hover{border-color:#ffb8c0}
  .stack-gap{display:flex;flex-direction:column;gap:14px}
  .panel-note{
    margin-top:6px;
    color:var(--muted);
  }

  .hero{padding-bottom:0}
  .hero-top{margin-bottom:10px}
  .hero .sub{font-size:12px;max-width:620px}

  .workspace-strip{
    display:flex;align-items:center;gap:8px;
    margin-bottom:14px;flex-wrap:wrap;
  }
  .workspace-spacer{flex:1}
  .minimal-status-row{
    min-height:28px;
    margin-bottom:12px;
  }
  .minimal-status{
    color:var(--muted);
    font-size:12px;
    line-height:28px;
    white-space:nowrap;
  }

  .sync-card{
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-top:14px;
    background:var(--surface);
  }
  .sync-head{
    display:flex;
    align-items:flex-start;
    gap:12px;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .sync-title{
    font-size:15px;
    font-weight:750;
    color:var(--text);
  }
  .sync-desc{
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
    max-width:520px;
  }
  .sync-summary{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:8px;
    margin-top:12px;
  }
  .sync-stat{
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 10px;
    background:var(--surface-2);
    min-width:0;
  }
  .sync-stat strong{
    display:block;
    font-size:20px;
    line-height:1;
    margin-bottom:4px;
  }
  .sync-stat span{
    display:block;
    color:var(--muted);
    font-size:10px;
    line-height:1.2;
  }
  .sync-review-list{
    display:grid;
    gap:8px;
    margin-top:10px;
  }
  .sync-review-item{
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
    background:var(--surface-2);
  }
  .sync-review-pair{
    display:grid;
    grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);
    gap:8px;
    align-items:center;
  }
  .sync-review-side{
    min-width:0;
  }
  .sync-review-kicker{
    color:var(--muted);
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.05em;
    margin-bottom:3px;
  }
  .sync-review-main{
    font-size:11px;
    font-weight:700;
    overflow-wrap:anywhere;
  }
  .sync-review-sub{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
    overflow-wrap:anywhere;
  }
  .sync-score{
    text-align:center;
    font-size:12px;
    font-weight:800;
  }
  .sync-review-actions{
    display:flex;
    gap:6px;
    margin-top:8px;
    justify-content:flex-end;
  }
  .sync-review-item.confirmed{
    border-color:#18a957;
  }
  .sync-review-item.rejected{
    opacity:.58;
  }
  .sync-details{
    margin-top:10px;
  }
  .sync-details summary{
    cursor:pointer;
    font-size:11px;
    font-weight:700;
  }
  .sync-small-list{
    max-height:180px;
    overflow:auto;
    margin-top:8px;
    border-top:1px solid var(--line);
  }
  .sync-small-row{
    padding:7px 0;
    border-bottom:1px solid var(--line);
    font-size:10px;
    overflow-wrap:anywhere;
  }
  @media (max-width:620px){
    .sync-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
    .sync-review-pair{grid-template-columns:1fr}
    .sync-score{text-align:left}
  }

  .rename-sort-card{
    display:block;
    margin-top:14px;
    padding:14px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#fafafa;
  }
  .rename-sort-copy{min-width:0}
  .rename-sort-title{
    font-size:13px;
    font-weight:750;
    color:var(--text);
  }
  .rename-sort-desc{
    margin-top:3px;
    color:var(--muted);
    font-size:11px;
    line-height:1.4;
  }
  .rename-sort-settings{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
    margin-top:12px;
  }
  .rename-sort-settings select,
  .rename-sort-settings input{
    width:100%;
    height:38px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:0 10px;
    background:#fff;
    color:var(--text);
    outline:none;
  }
  .rename-sort-settings select:focus,
  .rename-sort-settings input:focus{
    border-color:#111;
    box-shadow:0 0 0 3px rgba(17,17,17,.08);
  }
  .rename-sort-actions{
    display:flex;
    justify-content:flex-end;
    margin-top:10px;
  }
  .rename-sort-actions button{min-width:210px}

  .minimal-status b{
    color:var(--text);
    font-weight:700;
  }
  .minimal-status .sep{
    display:inline-block;
    margin:0 8px;
    color:#cfcfcf;
  }

  .section-card{
    background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:16px;
    box-shadow:0 5px 14px rgba(30,72,130,.035);
  }
  .section-card + .section-card{margin-top:12px}
  .step-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .step-badge{
    width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#111111;
    color:#fff;font-weight:800;
    box-shadow:none;
  }
  .step-title{font-size:16px;font-weight:800;color:var(--text)}
  .step-desc{color:var(--muted);line-height:1.45;margin:0 0 12px 38px}
  .normalize-gear-badge{
    font-size:14px;
    line-height:1;
  }

  .primary-lg{min-height:44px;padding:0 18px;font-size:14px}

  .subtabs{
    display:flex;gap:4px;padding:4px;
    border:1px solid var(--line);
    background:#f7f7f7;border-radius:12px;
    margin-bottom:14px;
  }
  .subtab-btn{
    flex:1;height:36px;border:0;border-radius:9px;
    background:transparent;box-shadow:none;color:var(--muted);
  }
  .subtab-btn:hover{transform:none;box-shadow:none;border-color:transparent}
  .subtab-btn.active{
    background:#fff;color:#111111;
    box-shadow:0 4px 12px rgba(40,89,166,.08);
  }
  .subpanel{display:none}
  .subpanel.active{display:block}

  .quick-card{
    position:relative;overflow:hidden;
    border:1px solid var(--line);
    background:#fafafa;
    border-radius:18px;padding:18px;
  }
  .quick-card::after{
    content:"";position:absolute;width:150px;height:150px;
    right:-55px;top:-75px;border-radius:50%;
    background:rgba(17,17,17,.04);
  }
  .quick-title{font-size:18px;font-weight:850;margin-bottom:6px}
  .quick-desc{color:var(--muted);line-height:1.45;max-width:620px;margin-bottom:14px}
  .quick-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .mini-pill{
    padding:5px 9px;border-radius:999px;
    border:1px solid #e5e5e5;background:#fff;
    color:#444444;font-size:11px;font-weight:650;
  }

  details.advanced{margin-top:12px;border:1px solid var(--line-2);background:#fbfdff}
  details.advanced summary{
    list-style:none;display:flex;align-items:center;justify-content:space-between;
    padding:2px 0;color:#555555;
  }
  details.advanced summary::-webkit-details-marker{display:none}
  details.advanced summary::after{content:"⌄";font-size:15px}
  details.advanced[open] summary::after{content:"⌃"}
  .advanced-body{padding-top:10px}

  .operation-bar{
    display:none;position:sticky;bottom:0;z-index:50;
    margin:14px -18px -18px;padding:12px 18px;
    border-top:1px solid var(--line);
    background:rgba(255,255,255,.98);
    box-shadow:none;
    align-items:center;gap:12px;
  }
  .operation-bar.active{display:flex}
  .operation-spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid #e5e5e5;border-top-color:#111111;
    animation:spin .8s linear infinite;flex:0 0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .operation-copy{flex:1;min-width:0}
  .operation-title{font-weight:750;color:var(--text)}
  .operation-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .stop-compact{
    height:36px;padding:0 12px;border-radius:10px;
    color:#111111;background:#ffffff;border-color:#d4d4d4;
  }

  .empty-report{text-align:center;padding:30px 16px;color:var(--muted)}
  .empty-report .big{font-size:24px;margin-bottom:8px}
  .compact-box{padding:14px;margin-bottom:12px}
  .compact-box .label{font-size:15px}
  textarea{min-height:150px}
  .toolbar-actions .icon-btn:first-child{display:none}


  .hero-top{gap:10px}
  h1{font-size:24px}
  .version-badge{border:1px solid var(--line)}
  .lang-switch{background:#fff}
  .tab-btn.active::after{background:#111111;height:2px;bottom:-1px}
  .step-badge{background:#111111}
  .quick-card::after{display:none}
  .operation-bar{border-top:1px solid var(--line)}
  .stop-compact:hover,.danger-btn:hover{border-color:#111111}
  button.primary:hover{border-color:#111111}
  .icon-btn,.status-chip,.subtabs,.checks,.note,.section-card,.box,.normalize-box,.section,.stat{box-shadow:none}
  .app-shell,.hero,.content,.box,.normalize-box,.section-card,.quick-card,.operation-bar{backdrop-filter:none}


  .structure-preview{
    margin:12px 0 14px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fafafa;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;
    line-height:1.8;
  }
  .structure-preview span{
    color:var(--muted);
    font-family:Inter,system-ui,sans-serif;
    font-size:10px;
    margin-left:6px;
  }
  .structure-parent{font-weight:750;color:var(--text)}
  .structure-child{padding-left:14px;color:#444}
  .title-settings-grid{grid-template-columns:repeat(3,minmax(0,1fr));}


  .titlefit-panel{
    border:1px solid var(--line);
    border-radius:16px;
    background:#fff;
    overflow:hidden;
  }
  .titlefit-head{
    padding:18px 18px 4px;
  }
  .titlefit-heading{
    font-size:18px;
    font-weight:800;
    color:var(--text);
  }
  .titlefit-lead{
    margin-top:5px;
    color:var(--muted);
    line-height:1.45;
    font-size:12px;
  }
  .titlefit-step{
    display:flex;
    gap:12px;
    padding:16px 18px;
  }
  .titlefit-step-index{
    width:24px;
    height:24px;
    flex:0 0 24px;
    border-radius:50%;
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:800;
  }
  .titlefit-step-body{
    flex:1;
    min-width:0;
  }
  .titlefit-step-title{
    font-size:14px;
    font-weight:750;
    color:var(--text);
  }
  .titlefit-step-hint{
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
    line-height:1.45;
  }
  .titlefit-main-btn{
    margin-top:12px;
    width:100%;
  }
  .titlefit-template-card{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fafafa;
  }
  .titlefit-template-card.empty{
    opacity:.7;
  }
  .titlefit-template-icon{
    width:34px;
    height:34px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    color:#fff;
    font-weight:800;
  }
  .titlefit-template-copy{min-width:0}
  .titlefit-template-state{
    font-size:12px;
    font-weight:700;
    color:var(--text);
  }
  .titlefit-template-meta{
    margin-top:2px;
    color:var(--muted);
    font-size:10px;
    line-height:1.4;
  }
  .titlefit-divider{
    height:1px;
    background:var(--line-2);
    margin:0 18px;
  }
  .titlefit-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:8px;
    margin-top:12px;
  }
  .titlefit-grid .field input{
    width:100%;
  }
  .titlefit-preview-list{
    display:grid;
    gap:8px;
    margin-top:10px;
  }
  .titlefit-preview-item{
    display:grid;
    grid-template-columns:88px minmax(0,1fr);
    gap:10px;
    align-items:center;
    padding:10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fafafa;
  }
  .titlefit-preview-thumb{
    width:88px;
    height:122px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line-2);
    background:#0b0d14;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .titlefit-preview-thumb img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#0b0d14;
  }
  .titlefit-preview-copy{
    min-width:0;
  }
  .titlefit-before{
    color:var(--muted);
    font-size:10px;
  }
  .titlefit-after{
    margin-top:4px;
    font-weight:700;
    color:var(--text);
    font-size:11px;
    line-height:1.35;
  }

@media (max-width: 720px){
    .summary{grid-template-columns:1fr 1fr}
    .checks{grid-template-columns:1fr}
    .autofit-grid{grid-template-columns:1fr}
  }

  .shared-reference-card{
    display:grid;
    grid-template-columns:132px minmax(0,1fr) auto;
    gap:12px;
    align-items:center;
    margin-bottom:14px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#fff;
  }
  .shared-reference-preview{
    width:132px;
    height:76px;
    border-radius:10px;
    overflow:hidden;
    background:#f5f5f5;
    border:1px solid var(--line-2);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .shared-reference-preview img{
    display:none;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#0b0d14;
  }
  .shared-reference-card.ready .shared-reference-preview img{display:block}
  .shared-reference-card.ready .shared-reference-placeholder{display:none}
  .shared-reference-placeholder{
    width:30px;
    height:30px;
    border:2px solid #c5c5c5;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
    font-size:18px;
    font-weight:700;
  }
  .shared-reference-copy{min-width:0}
  .shared-reference-eyebrow{
    font-size:9px;
    line-height:1.2;
    font-weight:800;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.07em;
    margin-bottom:4px;
  }
  .shared-reference-name{
    font-size:13px;
    line-height:1.25;
    font-weight:800;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .shared-reference-meta{
    margin-top:3px;
    color:var(--muted);
    font-size:10px;
    line-height:1.4;
  }
  .shared-reference-status{
    margin-top:4px;
    font-size:10px;
  }
  .shared-reference-actions{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .shared-reference-actions button{min-width:132px}
  .shared-reference-card.empty{background:#fafafa}
  @media (max-width:620px){
    .shared-reference-card{
      grid-template-columns:100px minmax(0,1fr);
    }
    .shared-reference-preview{
      width:100px;
      height:62px;
    }
    .shared-reference-actions{
      grid-column:1 / -1;
      flex-direction:row;
    }
    .shared-reference-actions button{
      min-width:0;
      flex:1;
    }
  }


  /* v13.6 — larger tab labels */
  .tab-btn{
    font-size:12px;
    font-weight:750;
  }

  .tab-ico{
    font-size:13px;
  }


  /* v13.9 — compact title tooltips */
  .step-title-row{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
  }

  .auto-gradient-title-row{
    margin-top:0;
  }

  .info-tip{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:18px;
    height:18px;
    min-width:18px;
    border:1px solid var(--line);
    border-radius:50%;
    background:#fff;
    color:#666;
    font-size:11px;
    line-height:1;
    font-weight:800;
    font-family:Arial,sans-serif;
    cursor:help;
    outline:none;
    user-select:none;
  }

  .info-tip:hover,
  .info-tip:focus{
    color:#111;
    border-color:#bdbdbd;
    background:#f7f7f7;
  }

  .info-tip-tooltip{
    position:absolute;
    left:50%;
    top:calc(100% + 9px);
    transform:translateX(-18%);
    width:340px;
    max-width:min(340px, calc(100vw - 72px));
    padding:11px 12px;
    border-radius:10px;
    background:#171717;
    color:#fff;
    font-size:11px;
    line-height:1.5;
    font-weight:500;
    letter-spacing:0;
    text-align:left;
    white-space:normal;
    box-shadow:0 8px 28px rgba(0,0,0,.22);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    z-index:100;
    transition:opacity .12s ease, visibility .12s ease;
  }

  .info-tip-tooltip::before{
    content:"";
    position:absolute;
    top:-5px;
    left:18%;
    width:10px;
    height:10px;
    background:#171717;
    transform:rotate(45deg);
  }

  .info-tip:hover .info-tip-tooltip,
  .info-tip:focus .info-tip-tooltip{
    opacity:1;
    visibility:visible;
  }

  .info-tip-tooltip .tooltip-lead{
    display:block;
    margin-bottom:6px;
    font-weight:700;
  }

  .info-tip-tooltip .tooltip-note{
    display:block;
    color:#d3d3d3;
  }


  /* v13.10 — reference controls */
  .shared-reference-card{
    position:relative;
  }

  .shared-reference-preview{
    position:relative;
  }

  .shared-reference-clear{
    position:absolute;
    top:5px;
    right:5px;
    z-index:6;
    width:22px;
    height:22px;
    min-width:22px;
    min-height:22px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,.9);
    border-radius:7px;
    background:rgba(17,17,17,.78);
    color:#fff;
    font-size:16px;
    line-height:1;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.22);
    backdrop-filter:blur(4px);
  }

  .shared-reference-clear:hover:not(:disabled){
    background:#111;
    color:#fff;
    border-color:#fff;
  }

  .shared-reference-clear:disabled{
    display:none;
  }

  button:disabled{
    cursor:not-allowed;
  }


  /* v13.12 — dedicated Sort tab */
  #tab-sort .rename-sort-card{
    margin-top:0;
  }

  #tab-sort #sortFramesStatus{
    margin:8px 4px 0 !important;
  }


  /* v13.13 — keep all navigation tabs in one row */
  .tabs{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:0;
    overflow:visible;
  }

  .tab-btn{
    min-width:0;
    width:100%;
    padding-left:4px;
    padding-right:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .tab-btn .tab-ico{
    flex:0 0 auto;
  }

  .tab-btn span:last-child{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* The report label is now short enough to fit without wrapping. */
  #tabReportsBtn span:last-child{
    overflow:visible;
    text-overflow:clip;
  }


  /* v13.14 */
  .sort-actions-left{
    display:flex;
    justify-content:flex-start;
  }

  .sort-actions-left #sortFramesAlpha{
    margin-left:0;
    margin-right:auto;
  }

  .magic-wand-icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    min-width:28px;
    border-radius:50%;
    background:#111;
    color:#fff;
  }

  .magic-wand-icon svg{
    display:block;
    width:16px;
    height:16px;
  }

</style>

function t(key) {
  return I18N[currentLang][key] ?? I18N.en[key] ?? key;
}

function localizeBackendMessage(message) {
  if (!message) return '';
  if (currentLang === 'en') return message;

  const exact = I18N.ru.backend[message];
  if (exact) return exact;

  if (message.startsWith('Duplicate title in table for ')) {
    return message.replace('Duplicate title in table for ', 'Дубликат title в таблице для ');
  }
  if (message.startsWith('Several titles matched inside this frame: ')) {
    return message.replace('Several titles matched inside this frame: ', 'Внутри фрейма совпало несколько title: ');
  }
  if (message.startsWith('Ambiguous fallback match for ')) {
    return message.replace('Ambiguous fallback match for ', 'Неоднозначное дополнительное совпадение для ');
  }
  if (message.startsWith('Several possible titles matched inside this frame: ')) {
    return message.replace('Several possible titles matched inside this frame: ', 'Внутри фрейма найдено несколько возможных title: ');
  }
  return message;
}

function saveLang(lang) {
  if(lang !== 'ru' && lang !== 'en') return;

  languageTouched = true;
  currentLang = lang;

  try {
    localStorage.setItem('gir-lang', lang);
    languageLoadedFromLocalStorage = true;
  } catch (e) {}

  applyLanguage();
  clearTransientLanguageStatuses();

  if(lastFullSyncResult){
    renderFullSyncResult(lastFullSyncResult);
  }

  if(settingsLoaded){
    saveSettingsNow();
  }
}


function clearTransientLanguageStatuses(){
  const ids=[
    'generatorStatus',
    'sortFramesStatus',
    'gradientStatus',
    'normalizeStatus',
    'titleFitStatus'
  ];

  for(const id of ids){
    const el=document.getElementById(id);
    if(el) el.innerHTML='';
  }
}

function getRowsForSharedReference(){
  if(!input.value.trim()) return [];
  const parsed=parseRows(input.value);
  return parsed.error ? [] : parsed.rows;
}

function clearTitleFitPreviewUrls(){
  if(!Array.isArray(titleFitPreviewUrls)) return;
  for(const url of titleFitPreviewUrls){
    try{ URL.revokeObjectURL(url); }catch(e){}
  }
  titleFitPreviewUrls=[];
}

function bytesToPreviewUrl(previewBytes){
  if(!previewBytes || !previewBytes.length) return '';

  try{
    const bytes=new Uint8Array(previewBytes);
    const blob=new Blob([bytes],{type:'image/png'});
    const url=URL.createObjectURL(blob);
    titleFitPreviewUrls.push(url);
    return url;
  }catch(e){
    return '';
  }
}

function updateSharedReferencePreview(previewBytes){
  const img=document.getElementById('sharedReferenceImage');

  if(sharedReferencePreviewUrl){
    try{ URL.revokeObjectURL(sharedReferencePreviewUrl); }catch(e){}
    sharedReferencePreviewUrl=null;
  }

  if(!previewBytes || !previewBytes.length){
    img.removeAttribute('src');
    return;
  }

  try{
    const bytes=new Uint8Array(previewBytes);
    const blob=new Blob([bytes],{type:'image/png'});
    sharedReferencePreviewUrl=URL.createObjectURL(blob);
    img.src=sharedReferencePreviewUrl;
  }catch(e){
    img.removeAttribute('src');
  }
}


function updateSelectionDependentControls(){
  const selectionCount=Number(lastSelectionInfo.count||0);
  const frameCount=Number(lastSelectionInfo.frameCount||0);
  const hasSelection=selectionCount>0;
  const hasFrames=frameCount>0;
  const hasReference=!!sharedReferenceData;

  const setDisabled=(id,disabled)=>{
    const el=document.getElementById(id);
    if(el) el.disabled=!!disabled;
  };

  // Tools that operate on selected card frames.
  setDisabled('rename', !hasFrames);
  setDisabled('runFullSync', !hasFrames);
  setDisabled('sortFramesAlpha', frameCount < 2);
  setDisabled('randomizeGradients', !hasFrames);
  setDisabled('autoMatchGradients', !hasFrames);

  // Generator can use the shared reference. Without one, exactly one selected
  // card/title is required so the backend can resolve the reference safely.
  setDisabled(
    'generateFromTable',
    !hasSelection || (!hasReference && selectionCount !== 1)
  );

  // Normalize / Title Fit accept either selected cards or their title layers,
  // but also require the shared reference.
  setDisabled('applyNormalize', !(hasReference && hasSelection));
  setDisabled('previewTitleFit', !(hasReference && hasSelection));
  setDisabled('applyTitleFit', !(hasReference && hasSelection));

  // A reference can only be replaced from one selected node.
  setDisabled('setSharedReference', selectionCount !== 1);

  const clearBtn=document.getElementById('clearSharedReference');
  if(clearBtn){
    clearBtn.disabled=!hasReference;
    clearBtn.title=t('sharedReferenceClear');
    clearBtn.setAttribute('aria-label',t('sharedReferenceClear'));
  }
}

function updateReferenceDependentControls(){
  updateSelectionDependentControls();
}

function renderSharedReference(){
  const card=document.getElementById('sharedReferenceCard');
  const name=document.getElementById('sharedReferenceName');
  const meta=document.getElementById('sharedReferenceMeta');
  const statusEl=document.getElementById('sharedReferenceStatus');
  const setBtn=document.getElementById('setSharedReference');
  const locateBtn=document.getElementById('locateSharedReference');

  document.getElementById('sharedReferenceLabel').textContent=
    t('sharedReferenceLabel');

  locateBtn.textContent=t('sharedReferenceLocate');
  updateReferenceDependentControls();

  if(!sharedReferenceData){
    card.classList.remove('ready');
    card.classList.add('empty');
    name.textContent=t('sharedReferenceEmpty');
    meta.textContent=t('sharedReferenceEmptyMeta');
    statusEl.textContent='';
    setBtn.textContent=t('sharedReferenceSet');
    locateBtn.disabled=true;
    updateSharedReferencePreview(null);
    return;
  }

  card.classList.remove('empty');
  card.classList.add('ready');

  name.textContent=
    sharedReferenceData.title ||
    sharedReferenceData.frameName ||
    t('sharedReferenceEmpty');

  const parts=[];

  if(sharedReferenceData.frameName){
    parts.push(sharedReferenceData.frameName);
  }

  if(
    sharedReferenceData.frameWidth &&
    sharedReferenceData.frameHeight
  ){
    parts.push(
      `${Math.round(sharedReferenceData.frameWidth*10)/10}×`+
      `${Math.round(sharedReferenceData.frameHeight*10)/10}px`
    );
  }

  if(sharedReferenceData.lines){
    parts.push(`${sharedReferenceData.lines} ${t('rowCountLabel')}`);
  }

  meta.textContent=parts.join(' · ');

  statusEl.textContent='';

  setBtn.textContent=t('sharedReferenceChange');
  locateBtn.disabled=false;
}

function readControlValue(id){
  const el = document.getElementById(id);
  if(!el) return null;
  if(el.type === 'checkbox') return !!el.checked;
  return el.value;
}

function writeControlValue(id, value){
  const el = document.getElementById(id);
  if(!el || value === undefined || value === null) return;

  if(el.type === 'checkbox'){
    el.checked = !!value;
  }else{
    el.value = String(value);
  }
}

function collectSettings(){
  const settings = {
    version: 1,
    lang: currentLang,
    tableText: input.value,
    mainTab: currentMainTab,
    normalizeAdvancedOpen: !!document.querySelector('#tab-normalize details.advanced')?.open,
    helpVisible: document.getElementById('heroSub').style.display !== 'none',
    controls: {}
  };

  for(const id of PERSIST_IDS){
    settings.controls[id] = readControlValue(id);
  }

  return settings;
}

function applySavedSettings(settings){
  if(!settings || typeof settings !== 'object'){
    settingsLoaded = true;
    updatePreview();
    return;
  }

  if(
    !languageTouched &&
    !languageLoadedFromLocalStorage &&
    (settings.lang === 'ru' || settings.lang === 'en')
  ){
    currentLang = settings.lang;
  }

  if(typeof settings.tableText === 'string'){
    input.value = settings.tableText;
  }

  if(settings.controls && typeof settings.controls === 'object'){
    for(const id of PERSIST_IDS){
      if(Object.prototype.hasOwnProperty.call(settings.controls,id)){
        writeControlValue(id, settings.controls[id]);
      }
    }
  }

  const advanced = document.querySelector('#tab-normalize details.advanced');
  if(advanced && typeof settings.normalizeAdvancedOpen === 'boolean'){
    advanced.open = settings.normalizeAdvancedOpen;
  }

  if(typeof settings.helpVisible === 'boolean'){
    document.getElementById('heroSub').style.display = settings.helpVisible ? 'block' : 'none';
  }

  const allowedTabs = ['rename','normalize','autofit','styles','sort','reports'];
  showTab(allowedTabs.includes(settings.mainTab) ? settings.mainTab : 'rename', false);
  settingsLoaded = true;
  applyLanguage();
  updatePreview();
}

function formatTitleFitMetric(value){
  if(value === null || value === undefined) return '';
  if(typeof value === 'number') return String(Math.round(value * 10) / 10);
  if(typeof value === 'object'){
    if(value.unit === 'PERCENT') return `${value.value}%`;
    if(value.unit === 'PIXELS') return `${Math.round(value.value * 10) / 10}px`;
  }
  return '';
}

function parseCsvLine(line) {
  const out=[]; let value=''; let quoted=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch === '"'){
      if(quoted && line[i+1] === '"'){ value+='"'; i++; }
      else quoted=!quoted;
    } else if(ch === ',' && !quoted){ out.push(value); value=''; }
    else value+=ch;
  }
  out.push(value); return out;
}

function splitLine(line){
  if(line.includes('\t')) return line.split('\t');
  if(line.includes(';')) return line.split(';');
  return parseCsvLine(line);
}

function norm(v){ return String(v||'').trim().toLowerCase().replace(/[\s_-]+/g,''); }

function looksLikeIdentifier(v){
  const s=String(v||'').trim();
  if(!s) return false;

  const lower=s.toLowerCase();

  // These are category values, not identifiers.
  const categoryValues=[
    'slots',
    'slot',
    'casual',
    'table_games',
    'tablegames',
    'live_games',
    'livegames',
    'instant_games',
    'instantgames',
    'originals',
    'original_games',
    'originalgames'
  ];

  if(categoryValues.includes(lower)) return false;

  // Legacy identifiers:
  // mg_slots_autoroulette
  // hsg_baccarat
  // ntn_somegame
  const legacy =
    /^[a-z0-9]{2,32}_[a-z0-9][a-z0-9_-]*$/i.test(s);

  // New namespaced identifiers:
  // bgmng:GoldMagnate
  // bgmng:GoldRushWithJohnny
  //
  // Preserve original case after ":" because the backend should rename the
  // Figma frame to the exact identifier from the table.
  const namespaced =
    /^[a-z0-9][a-z0-9_-]{1,31}:[a-z0-9][a-z0-9._:-]*$/i.test(s);

  return legacy || namespaced;
}

function looksLikeNoise(v){
  const s=String(v||'').trim().toLowerCase();
  return !s || /^\d+$/.test(s) || s==='1' || s==='0' ||
    ['slots','slot','casual','table_games','tablegames','live_games','livegames','instant_games','instantgames','originals','original_games','originalgames','enabled','category','id','identifier','provider'].includes(s);
}

function getConfiguredTableColumns(){
  const titleEl=document.getElementById('tableTitleColumn');
  const identifierEl=document.getElementById('tableIdentifierColumn');

  const titleColumn=Math.max(0,Math.floor(Number(titleEl?.value)||0));
  const identifierColumn=Math.max(0,Math.floor(Number(identifierEl?.value)||0));

  return {
    titleColumn,
    identifierColumn,
    manual:titleColumn>0 && identifierColumn>0
  };
}

function looksLikeMappedHeader(title,identifier){
  const titleHeaders=['title','gamename','game','name','slotname'];
  const identifierHeaders=[
    'identifier','gameidentifier','game_identifier',
    'externalidentifier','external_id','slug'
  ].map(norm);

  return (
    titleHeaders.includes(norm(title)) ||
    identifierHeaders.includes(norm(identifier))
  );
}

}

function parseRows(raw){
  const lines=raw.replace(/\r/g,'').split('\n').filter(x=>x.trim().length);
  if(!lines.length) return {rows:[],error:t('nothingPasted')};

  const matrix=lines.map(splitLine).map(r=>r.map(v=>String(v).trim()));
  const configured=getConfiguredTableColumns();

  const titleAliases=['title','gamename','game','name','slotname'];
  const identifierAliases=[
    'identifier','gameidentifier','game_identifier',
    'externalidentifier','external_id','slug'
  ];
  const normalizedIdentifierAliases=identifierAliases.map(norm);

  const categoryValues=[
    'slots','slot','casual','table_games','tablegames',
    'live_games','livegames','instant_games','instantgames',
    'originals','original_games','originalgames'
  ];

  let rows=[];
  let detectedTitleColumn=0;
  let detectedIdentifierColumn=0;
  let detectionMode='auto';

  // MANUAL MODE: the content of Identifier is completely opaque.
  // No regex and no provider-specific naming format is used.
  if(configured.manual){
    const titleIdx=configured.titleColumn-1;
    const identifierIdx=configured.identifierColumn-1;

    detectedTitleColumn=configured.titleColumn;
    detectedIdentifierColumn=configured.identifierColumn;
    detectionMode='manual';

    for(const cols of matrix){
      const title=(cols[titleIdx]||'').trim();
      const identifier=(cols[identifierIdx]||'').trim();

      if(!title || !identifier) continue;
      if(looksLikeMappedHeader(title,identifier)) continue;

      rows.push({title,identifier});
    }
  }

  // AUTO MODE: headers first.
  if(!rows.length && !configured.manual){
    let headerRow=-1;
    let titleIdx=-1;
    let identifierIdx=-1;

    for(let r=0;r<Math.min(matrix.length,15);r++){
      const h=matrix[r].map(norm);
      const t=h.findIndex(x=>titleAliases.includes(x));
      const id=h.findIndex(x=>normalizedIdentifierAliases.includes(x));

      if(t!==-1 && id!==-1){
        headerRow=r;
        titleIdx=t;
        identifierIdx=id;
        detectedTitleColumn=t+1;
        detectedIdentifierColumn=id+1;
        detectionMode='header';
        break;
      }
    }

    if(headerRow!==-1){
      for(let i=headerRow+1;i<matrix.length;i++){
        const title=(matrix[i][titleIdx]||'').trim();
        const identifier=(matrix[i][identifierIdx]||'').trim();

        if(title && identifier){
          rows.push({title,identifier});
        }
      }
    }
  }

  // AUTO MODE without headers: structural relation around category.
  if(!rows.length && !configured.manual){
    for(const cols of matrix){
      let categoryIdx=-1;

      for(let j=0;j<cols.length;j++){
        const v=String(cols[j]||'').trim().toLowerCase();
        if(categoryValues.includes(v)){
          categoryIdx=j;
          break;
        }
      }

      if(categoryIdx!==-1){
        const candidateTitle=(cols[categoryIdx-2]||'').trim();
        const candidateEnabled=(cols[categoryIdx-1]||'').trim();
        const candidateIdentifier=(cols[categoryIdx+1]||'').trim();

        if(
          candidateTitle &&
          candidateIdentifier &&
          (
            candidateEnabled==='1' ||
            candidateEnabled==='0' ||
            candidateEnabled==='true' ||
            candidateEnabled==='false'
          )
        ){
          rows.push({
            title:candidateTitle,
            identifier:candidateIdentifier
          });

          if(!detectedTitleColumn){
            detectedTitleColumn=categoryIdx-1;
            detectedIdentifierColumn=categoryIdx+2;
            detectionMode='schema';
          }

          continue;
        }
      }

      // Legacy last-resort heuristic.
      const identifierIndexes=[];

      for(let j=0;j<cols.length;j++){
        if(looksLikeIdentifier(cols[j])) identifierIndexes.push(j);
      }

      if(!identifierIndexes.length) continue;

      const idIdx=identifierIndexes[identifierIndexes.length-1];
      const identifier=cols[idIdx].trim();

      let title='';
      let inferredTitleIdx=-1;

      for(let j=idIdx-1;j>=0;j--){
        const s=(cols[j]||'').trim();
        if(!s) continue;
        if(looksLikeNoise(s) || looksLikeIdentifier(s)) continue;

        title=s;
        inferredTitleIdx=j;
        break;
      }

      if(title && identifier){
        rows.push({title,identifier});

        if(!detectedTitleColumn){
          detectedTitleColumn=inferredTitleIdx+1;
          detectedIdentifierColumn=idIdx+1;
          detectionMode='heuristic';
        }
      }
    }
  }

  // IMPORTANT:
  // Every parsed spreadsheet row is a separate physical card slot.
  // Do NOT deduplicate by title or identifier.
  //
  // Examples that must remain separate:
  // Hatching Gold! Rooster's Riches -> mgg_hatchinggoldroostersriches
  // Hatching Gold! Rooster's Riches -> mgg_hatchinggoldroostersriches92
  //
  // Even two fully identical rows remain two required physical cards.
  const clean=rows.map((r,index)=>({
    ...r,
    _syncRowKey:`table-row-${index+1}`
  }));

  const columns={
    title:detectedTitleColumn,
    identifier:detectedIdentifierColumn,
    mode:detectionMode
  };

  return clean.length
    ? {rows:clean,error:null,columns}
    : {rows:[],error:t('cannotRecognize'),columns};
}

function updateMinimalStatus(){
  const count = (lastSelectionInfo && Number.isFinite(lastSelectionInfo.count)) ? lastSelectionInfo.count : 0;
  let rows = 0;
  const raw = input.value.trim();

  if(raw){
    const p = parseRows(raw);
    if(!p.error) rows = p.rows.length;
  }

  document.getElementById('minimalStatus').innerHTML =
    `${t('selectedChip')} <b>${count}</b> <span class="sep">·</span> ${t('tableChip')} <b>${rows}</b>`;
}

function updatePreview(){
  if(!input.value.trim()){
    preview.innerHTML='';
    updateMinimalStatus();
    return;
  }

  const p=parseRows(input.value);
  updateMinimalStatus();

  if(p.error){
    preview.innerHTML=`<span class="err">${esc(p.error)}</span>`;
    return;
  }

  const sample=p.rows.slice(0,3)
    .map(r=>`${esc(r.title)} → <code>${esc(r.identifier)}</code>`)
    .join('<br>');

  const columns=p.columns||{};
  const mapping=
    columns.title && columns.identifier
      ? `<br><span class="hint">${t('tableColumnsDetected')}: Title ${columns.title} · Identifier ${columns.identifier}</span>`
      : '';

  preview.innerHTML=
    `<span class="ok">${t('gamesDetected')}: <b>${p.rows.length}</b></span>`+
    mapping+
    (sample ? `<br>${sample}` : '');
}

function rgb255ToHsv(r, g, b){
  r/=255; g/=255; b/=255;

  const max=Math.max(r,g,b);
  const min=Math.min(r,g,b);
  const delta=max-min;

  let h=0;

  if(delta>0.00001){
    if(max===r) h=((g-b)/delta)%6;
    else if(max===g) h=(b-r)/delta+2;
    else h=(r-g)/delta+4;

    h*=60;
    if(h<0) h+=360;
  }

  return {
    h,
    s:max===0?0:delta/max,
    v:max
  };
}

async function decodeGradientAnalysisImage(bytes){
  const blob=new Blob([bytes],{type:'image/png'});

  if(typeof createImageBitmap==='function'){
    return await createImageBitmap(blob);
  }

  return await new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(blob);
    const img=new Image();

    img.onload=()=>{
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error('Could not decode exported card image.'));
    };

    img.src=url;
  });
}

async function analyzeBannerDominantColor(bytes,topPercent){
  const image=await decodeGradientAnalysisImage(bytes);

  const width=Math.max(1,Math.min(72,image.width||72));
  const sourceHeight=Math.max(1,image.height||1);
  const areaRatio=Math.max(0.35,Math.min(0.95,(Number(topPercent)||70)/100));
  const sampledHeight=Math.max(1,Math.round(sourceHeight*areaRatio));
  const height=Math.max(1,Math.round(width*(sampledHeight/Math.max(1,image.width||width))));

  const canvas=document.createElement('canvas');
  canvas.width=width;
  canvas.height=height;

  const ctx=canvas.getContext('2d',{willReadFrequently:true});

  if(!ctx) throw new Error('Canvas color analysis is unavailable.');

  // Crop to the top artwork region so the current bottom gradient/title does
  // not dominate the color choice.
  ctx.drawImage(
    image,
    0,0,image.width||width,sampledHeight,
    0,0,width,height
  );

  if(image && typeof image.close==='function'){
    try{image.close();}catch(e){}
  }

  const data=ctx.getImageData(0,0,width,height).data;
  const bins=24;
  const histogram=new Array(bins).fill(0);
  const samples=[];
  let totalWeight=0;

  for(let y=0;y<height;y++){
    const verticalWeight=0.75+0.45*(y/Math.max(1,height-1));

    for(let x=0;x<width;x++){
      const i=(y*width+x)*4;
      const r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];

      if(a<80) continue;

      const hsv=rgb255ToHsv(r,g,b);

      // Ignore neutral UI/background pixels and very dark pixels.
      if(hsv.v<0.1) continue;
      if(hsv.s<0.20) continue;
      if(hsv.v>0.94 && hsv.s<0.24) continue;

      const weight=
        Math.pow(hsv.s,1.45)*
        (0.35+0.65*hsv.v)*
        verticalWeight;

      if(weight<=0) continue;

      const bin=Math.min(
        bins-1,
        Math.floor((hsv.h/360)*bins)
      );

      histogram[bin]+=weight;
      totalWeight+=weight;
      samples.push({r,g,b,hsv,weight,bin});
    }
  }

  // If there are almost no chromatic pixels, do a softer second pass.
  if(samples.length<8){
    for(let y=0;y<height;y++){
      for(let x=0;x<width;x++){
        const i=(y*width+x)*4;
        const r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];

        if(a<80) continue;

        const hsv=rgb255ToHsv(r,g,b);

        if(hsv.v<0.08) continue;
        if(hsv.s<0.10) continue;
        if(hsv.v>0.96 && hsv.s<0.15) continue;

        const weight=Math.max(0.05,hsv.s)*(0.3+0.7*hsv.v);
        const bin=Math.min(bins-1,Math.floor((hsv.h/360)*bins));

        histogram[bin]+=weight;
        totalWeight+=weight;
        samples.push({r,g,b,hsv,weight,bin});
      }
    }
  }

  if(!samples.length){
    throw new Error('No usable banner color was detected.');
  }

  let bestBin=0;

  for(let i=1;i<bins;i++){
    if(histogram[i]>histogram[bestBin]) bestBin=i;
  }

  let sumR=0,sumG=0,sumB=0,sumW=0;

  for(const sample of samples){
    const direct=Math.abs(sample.bin-bestBin);
    const circular=Math.min(direct,bins-direct);

    if(circular>1) continue;

    const neighborhoodWeight=
      circular===0?1:0.42;

    const w=sample.weight*neighborhoodWeight;

    sumR+=sample.r*w;
    sumG+=sample.g*w;
    sumB+=sample.b*w;
    sumW+=w;
  }

  if(sumW<=0){
    throw new Error('Could not calculate the dominant banner color.');
  }

  const r=Math.round(sumR/sumW);
  const g=Math.round(sumG/sumW);
  const b=Math.round(sumB/sumW);
  const hsv=rgb255ToHsv(r,g,b);

  return {
    color:{
      r:r/255,
      g:g/255,
      b:b/255,
      h:hsv.h,
      s:hsv.s,
      v:hsv.v
    },
    confidence:
      totalWeight>0
        ? histogram[bestBin]/totalWeight
        : 0
  };
}

function updateFullSyncReviewUI(review,aliasCount){
  if(!review) return;

  fullSyncReviewState.set(review.id,review);

  const item=document.getElementById(`syncReview-${review.id}`);
  if(!item) return;

  item.classList.toggle('confirmed',review.confirmed===true);
  item.classList.toggle('rejected',review.rejected===true);

  const actions=item.querySelector('.sync-review-actions');

  if(actions){
    if(review.confirmed){
      actions.innerHTML=`<span class="ok">${t('fullSyncConfirmed')}</span>`;
    }else if(review.rejected){
      actions.innerHTML=`<span class="hint">${t('fullSyncRejected')}</span>`;
    }
  }

  const aliasEl=document.getElementById('fullSyncAliasCount');

  if(aliasEl && aliasCount!==undefined){
    aliasEl.textContent=String(aliasCount);
  }

  const anyConfirmed=[...fullSyncReviewState.values()].some(x=>x.confirmed===true);
  const applyBtn=document.getElementById('applyFullSync');

  if(anyConfirmed){
    applyBtn.disabled=false;
  }
}

onmessage=async (event)=>{
  const msg=event.data.pluginMessage;

  if(msg && msg.type==='gradient-color-analyze-request'){
    try{
      const analyzed=await analyzeBannerDominantColor(
        msg.bytes,
        msg.topPercent
      );

      parent.postMessage({
        pluginMessage:{
          type:'gradient-color-analyze-result',
          requestId:msg.requestId,
          color:analyzed.color,
          confidence:analyzed.confidence
        }
      },'*');
    }catch(e){
      parent.postMessage({
        pluginMessage:{
          type:'gradient-color-analyze-result',
          requestId:msg.requestId,
          error:e && e.message ? e.message : String(e)
        }
      },'*');
    }

    return;
  }


  if(msg.type==='settings-loaded'){
    applySavedSettings(msg.settings);
    return;
  }
  if(!msg) return;

  if(msg.type==='shared-reference-error'){
    document.getElementById('sharedReferenceStatus').innerHTML=
      `<span class="err">${esc(localizeBackendMessage(msg.message||''))}</span>`;
    return;
  }

  if(msg.type==='shared-reference-cleared'){
    sharedReferenceData=null;
    normalizeReferenceData=null;
    titleFitTemplateSummary=null;

    updateSharedReferencePreview(null);
    renderSharedReference();
    renderTitleFitTemplate();
    updateSelectionDependentControls();

    const normalizeStatus=document.getElementById('normalizeStatus');

          <div class="section-head">${t('duplicateBanners')} (${msg.duplicates.length})</div>
          <div style="padding:8px 10px 0">
            <div class="hint" style="margin-bottom:8px">${t('duplicateBannersHint')}</div>
            <button id="selectDuplicates">${t('selectDuplicates')}</button>
          </div>
          <div class="list">`;

      for(const x of msg.duplicates){
        const texts=x.texts && x.texts.length
          ? `<br><span class="hint">${t('text')}: ${x.texts.map(esc).join(' · ')}</span>`
          : '';

        const duplicateInfo=x.duplicateIdentifier
          ? `<br><span class="hint">${esc(x.duplicateIdentifier)} · ${esc(x.duplicateOfFrameName||'')}</span>`
          : '';

        html+=`
          <div class="item">
            <code>${esc(x.frameName)}</code>
            ${duplicateInfo}
            ${texts}
          </div>`;
      }

      html+=`</div></div>`;
    }

    if(msg.extras && msg.extras.length){
      html+=`
        <div class="section">
          <div class="section-head">${t('extraBanners')} (${msg.extras.length})</div>
          <div style="padding:8px 10px 0">
            <div class="hint" style="margin-bottom:8px">${t('extraBannersHint')}</div>
            <button id="selectExtras">${t('selectExtras')}</button>
          </div>
          <div class="list">`;

      for(const x of msg.extras){
        const texts=x.texts && x.texts.length
          ? `<br><span class="hint">${t('text')}: ${x.texts.map(esc).join(' · ')}</span>`
          : '';

        const reason=x.reason
          ? `<br><span class="hint">${esc(localizeBackendMessage(x.reason))}</span>`
          : '';

        html+=`
          <div class="item">
            <code>${esc(x.frameName)}</code>
            ${reason}
            ${texts}
          </div>`;
      }

      html+=`</div></div>`;
    }

    if(msg.missing.length){
      html+=`
        <div class="section">
          <div class="section-head">${t('missingBanners')} (${msg.missing.length})</div>
          <div class="list">`;

      for(const x of msg.missing){
        html+=`
          <div class="item">
            <b>${esc(x.title)}</b>
            <br><code>${esc(x.identifier)}</code>
          </div>`;
      }
      html+=`</div></div>`;
    }

    if(msg.skipped.length){
      html+=`
        <div class="section">
          <div class="section-head">${t('skippedFrames')} (${msg.skipped.length})</div>
          <div style="padding:8px 10px 0">
            <button id="selectSkipped">${t('selectSkipped')}</button>
          </div>
          <div class="list">`;

      for(const x of msg.skipped){
        const texts=x.texts && x.texts.length
          ? `<br><span class="hint">${t('text')}: ${x.texts.map(esc).join(' · ')}</span>`
          : '';
        html+=`
          <div class="item">
            <code>${esc(x.frameName)}</code>
            <br>${esc(localizeBackendMessage(x.reason))}
            ${texts}
          </div>`;
      }
      html+=`</div></div>`;
    }

    if(msg.matched.length){
      html+=`
        <div class="section">
          <div class="section-head">${t('renamedFrames')} (${msg.matched.length})</div>
          <div class="list">`;
      for(const x of msg.matched){
        html+=`<div class="item">${esc(x.title)} → <code>${esc(x.identifier)}</code></div>`;
      }
      html+=`</div></div>`;
    }

    status.innerHTML=html;

    document.querySelectorAll('[data-select-shared-group]').forEach(btn=>{
      btn.onclick=()=>{
        const nodeIds=String(btn.dataset.selectSharedGroup||'')
          .split(',')
          .filter(Boolean);

        parent.postMessage({
          pluginMessage:{
            type:'select-shared-identifier-cards',
            nodeIds,
            lang:currentLang
          }
        },'*');
      };
    });

    const allSharedBtn=document.getElementById('selectAllSharedIdentifierCards');

    if(allSharedBtn){
      allSharedBtn.onclick=()=>{
        parent.postMessage({
          pluginMessage:{
            type:'select-shared-identifier-cards',
            nodeIds:sharedIdentifierCardIds,
            lang:currentLang
          }
        },'*');
      };
    }

    const duplicatesBtn=document.getElementById('selectDuplicates');
    if(duplicatesBtn){
      duplicatesBtn.onclick=()=>{
        parent.postMessage({
          pluginMessage:{
            type:'select-duplicates',
            nodeIds:duplicateIds,
            lang:currentLang
          }
        },'*');
      };
    }

    const extrasBtn=document.getElementById('selectExtras');
    if(extrasBtn){
      extrasBtn.onclick=()=>{
        parent.postMessage({
          pluginMessage:{
            type:'select-extras',
            nodeIds:extraIds,
            lang:currentLang
          }
        },'*');
      };
    }

    const btn=document.getElementById('selectSkipped');
    if(btn){
      btn.onclick=()=>{
        parent.postMessage({pluginMessage:{type:'select-skipped',nodeIds:skippedIds,lang:currentLang}},'*');
      };
    }
  }
};

function esc(s){
  return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#039;');
}

applyLanguage();
parent.postMessage({pluginMessage:{type:'load-settings'}},'*');
parent.postMessage({pluginMessage:{type:'load-titlefit-template'}},'*');
parent.postMessage({pluginMessage:{type:'get-selection'}},'*');

window.addEventListener('beforeunload', ()=>{
  if(settingsLoaded) saveSettingsNow();
});
</script>

  </div>
</div>
</body>
</html>
